; NOVA RIDE OS - milepæl 1: CYD hardware-probe (display/touch-test)
; Byg begge miljøer og flash det der giver korrekt billede.
[platformio]
default_envs = cyd_st7789

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    paulstoffregen/XPT2046_Touchscreen@^1.4
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSMOOTH_FONT=0

[env:cyd_st7789]
build_flags = ${env.build_flags}
    -DST7789_DRIVER=1
    -DPROFILE_NAME=\"ST7789\"

[env:cyd_ili9341]
build_flags = ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DPROFILE_NAME=\"ILI9341_2\"
